name: CI

on:
  push:
    branches:
      - main
      - dev

  pull_request:
    branches:
      - main
      - dev

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hmcts_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hmcts_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hmcts_test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hmcts_test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Bootstrap test database
        run: |
          psql "$TEST_DATABASE_URL" -f backend/serverDev/create_table.sql
          psql "$TEST_DATABASE_URL" -f backend/serverDev/due_date_constraints.sql

      - name: Run linting
        run: npm run lint

      - name: Run tests
        run: npm test
