name: CI

on:
  push:
    branches:
      - main
      - dev

  pull_request:
    branches:
      - main
      - dev

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hmcts_task_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hmcts_task_test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://maccurtis:@localhost:5432/hmcts_task_db
      TEST_DATABASEURL: postgres://maccurtis:@localhost:5432/hmcts_task_test_db

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Bootstrap test database
        run: |
          psql "$TEST_DATABASE_URL" -f backend/serverDev/001_create_table.sql
          psql "$TEST_DATABASE_URL" -f backend/serverDev/002_due_date_constraints.sql

      - name: Run linting
        run: npm run lint

      - name: Run tests
        run: npm test
