name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hmcts_task_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hmcts_task_test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/hmcts_task_db
      TEST_DATABASE_URL: postgres://postgres:postgres@postgres:5432/hmcts_task_test_db
      PGPASSWORD: postgres

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Reset test database
        run: |
          psql -U postgres -h postgres -c "DROP DATABASE IF EXISTS hmcts_task_test_db;"
          psql -U postgres -h postgres -c "CREATE DATABASE hmcts_task_test_db;"

      - name: Apply migrations
        run: |
          psql -U postgres -h postgres -d hmcts_task_test_db -f backend/migrations/001_create_table.sql
          psql -U postgres -h postgres -d hmcts_task_test_db -f backend/migrations/002_due_date_constraints.sql

      - name: Run linting
        run: npm run lint

      - name: Run tests
        run: npm test
